
<!DOCTYPE html>


<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Rajab PS4</title>

<style>

html, body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #05070c;
    color: #e6ebf2;

    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;

    overflow: hidden;
}

body {
    background:
        linear-gradient(
            rgba(3, 8, 20, .58),
            rgba(3, 8, 20, .86)
        ),
        url("ps4-background.jpg")
        center center / cover no-repeat fixed;
}

/* Main */

#wrap {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

/* Brand */

#brand {
    position: absolute;

    top: 34px;
    left: 0;
    right: 0;

    text-align: center;
}

#brand b {
    font-size: 34px;

    font-weight: 700;

    letter-spacing: .14em;

    color: #fff;

    text-shadow:
        0 2px 15px rgba(0,0,0,.8);
}

#brandLine {
    width: 75px;
    height: 2px;

    margin: 12px auto 0;

    background: rgba(255,255,255,.65);
}

/* State */

#state {
    font-size: 24px;

    font-weight: 400;

    margin-bottom: 12px;

    color: #fff;

    text-shadow:
        0 2px 12px rgba(0,0,0,.9);
}

#det {
    font-size: 13px;

    color: #aab3c0;

    margin-bottom: 4px;
}

#det b {
    color: #fff;
    font-weight: 600;
}

#cache {
    min-height: 16px;

    font-size: 12px;

    color: #707b89;
}

#cache.cacheok {
    color: #82d5a2;
}

/* Loader */

.loader {
    width: 42px;
    height: 42px;

    margin: 18px auto;

    border:
        3px solid rgba(255,255,255,.17);

    border-top-color:
        rgba(255,255,255,.95);

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}

/* Status */

.ok {
    color: #82d5a2;
}

.bad {
    color: #e98980;
}

.warn {
    color: #e6ebf2;
}

/* Footer */

#footer {
    position: absolute;

    bottom: 27px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 11px;

    letter-spacing: .28em;

    color: rgba(255,255,255,.42);
}

</style>

</head>


<body>


<div id="brand">

    <b>Rajab</b>

    <div id="brandLine"></div>

</div>


<div id="wrap">

    <div id="state">
        detecting firmware...
    </div>

    <div class="loader"></div>

    <div id="det"></div>

    <div id="cache"></div>

</div>


<div id="footer">
    PLAYSTATION 4
</div>


<script>

(function () {

    var stateEl =
        document.getElementById("state");

    var detEl =
        document.getElementById("det");

    var cacheEl =
        document.getElementById("cache");


    function setState(t, c) {

        stateEl.textContent = t;
        stateEl.className = c || "";

    }


    function setCache(t, ok) {

        cacheEl.textContent = t;

        cacheEl.className =
            ok ? "cacheok" : "";

    }


    /*
     * Firmware detection
     */

    var key = null;
    var fwnum = null;

    var m =
        /PlayStation\s+4[\/ ]\((\d+)\.(\d+)/i
        .exec(navigator.userAgent);


    if (m) {

        var major =
            parseInt(m[1], 10);

        var minor =
            parseInt(m[2], 10);

        key =
            major + "." +
            minor.toString().padStart(2, "0");

        fwnum =
            major * 100 +
            minor;

    }


    /*
     * Poops ONLY
     */

    var bug = "poops";


    detEl.innerHTML =
        "firmware <b>" +
        (key || "unknown") +
        "</b> &middot; bug <b>poops</b>";


    /*
     * Always use the existing
     * run_poops.html file.
     */

    var target =
        "run_poops.html" +
        location.search;


    function go() {

        setState(
            "loading poops...",
            "warn"
        );

        location.replace(target);

    }


    /*
     * Application Cache
     */

    var ac =
        window.applicationCache;


    /*
     * No X button.
     * No click handler.
     * No waitForTap().
     */

    if (
        !ac ||
        !document.documentElement
            .hasAttribute("manifest")
    ) {

        go();

    }

    else if (!navigator.onLine) {

        setCache(
            "offline -- from cache",
            true
        );

        go();

    }

    else if (
        ac.status === ac.IDLE
    ) {

        setCache(
            "cached",
            true
        );

        go();

    }

    else if (
        ac.status === ac.UPDATEREADY
    ) {

        try {
            ac.swapCache();
        }

        catch (e) {}

        setCache(
            "update downloaded",
            true
        );

        /*
         * Reload immediately.
         */

        location.reload();

    }

    else {

        setCache(
            "checking cache..."
        );


        ac.addEventListener(
            "downloading",

            function () {

                setCache(
                    "caching for offline..."
                );

            },

            false
        );


        ac.addEventListener(
            "progress",

            function (e) {

                if (
                    e &&
                    e.total
                ) {

                    setCache(
                        "caching " +
                        Math.round(
                            (e.loaded /
                             e.total) * 100
                        ) +
                        "%"
                    );

                }

            },

            false
        );


        ac.addEventListener(
            "cached",

            function () {

                setCache(
                    "cached for offline use",
                    true
                );

                /*
                 * Start automatically.
                 */

                go();

            },

            false
        );


        ac.addEventListener(
            "updateready",

            function () {

                try {
                    ac.swapCache();
                }

                catch (e) {}

                setCache(
                    "update downloaded",
                    true
                );

                /*
                 * No X.
                 * Reload immediately.
                 */

                location.reload();

            },

            false
        );


        ac.addEventListener(
            "noupdate",

            function () {

                setCache(
                    "cached -- offline ready",
                    true
                );

                go();

            },

            false
        );


        ac.addEventListener(
            "error",

            function () {

                setCache(
                    "cache unavailable"
                );

                /*
                 * Run existing target
                 * without waiting for X.
                 */

                go();

            },

            false
        );


        ac.addEventListener(
            "obsolete",

            function () {

                setCache(
                    "cache obsolete"
                );

                go();

            },

            false
        );

    }


})();

</script>

</body>

</html>
